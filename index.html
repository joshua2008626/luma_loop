<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>LUMA LOOP</title>
<style>
html,body{margin:0;height:100%;background:#050818;overflow:hidden;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#game{width:100%;height:100%}
#pad{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:12px calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));pointer-events:none}
.g{display:flex;gap:12px;pointer-events:auto}
.b{width:68px;height:68px;border-radius:50%;border:2px solid #6ff;background:rgba(40,120,180,.35);color:#dff;font:26px system-ui;display:flex;align-items:center;justify-content:center}
.b.on{background:rgba(100,255,255,.55)}#sw{border-color:#d6f;background:rgba(150,60,200,.35)}
@media (pointer:coarse){body.playing #pad{display:flex}}
</style></head><body>
<div id="game"></div>
<div id="pad"><div class="g"><div class="b" id="bl">◀</div><div class="b" id="br">▶</div></div><div class="g"><div class="b" id="sw">⇄</div><div class="b" id="bj">▲</div></div></div>
<script type="module" src="/src/main.js"></script>
</body></html>
